# Local/dev compose file.
services:
  pyburlybot:
    image: ghcr.io/clammet/pyburlybot:latest
    build: .
    container_name: pyburlybot
    restart: unless-stopped
    environment:
      PYBB_HEARTBEAT_FILE: state/.heartbeat
    volumes:
      - pyburlybot_data:/app/state
      # Shared datasets: one volume per /app/shared/<name>, rw here, ro in the
      # consumer (e.g. the reverse proxy serving pastes). Add new shared
      # datasets the same way rather than exposing /app/state.
      - pyburlybot_pastes:/app/shared/pastes
    # Reload webhook (webhook module, listen_host 0.0.0.0): host-loopback only.
    # ports:
    #   - "127.0.0.1:8642:8642"
    # graceful shutdown is staged over ~3s (IRC QUIT, DB flush, reactor stop)
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 90s

  paste-cleanup:
    image: ghcr.io/clammet/pyburlybot:latest
    build: .
    restart: unless-stopped
    environment:
      PYBB_PASTE_RETENTION_DAYS: "365"
      PYBB_PASTE_CLEANUP_INTERVAL_SECONDS: "86400"
    volumes:
      - pyburlybot_pastes:/app/shared/pastes
    entrypoint: ["/usr/bin/tini", "--", "python", "docker/paste_cleanup.py"]

volumes:
  pyburlybot_data:
    name: pyburlybot_data
  pyburlybot_pastes:
    name: pyburlybot_pastes
