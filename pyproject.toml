[tool.ruff]
# The one deliberate version pin in this project: one minor version behind the
# newest Python, so ruff format/lint never rewrite code into newest-only syntax
# (e.g. PEP 758 unparenthesized except tuples on 3.14). Bump alongside runtime.
target-version = "py313"

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "BLE", "DTZ", "E4", "E7", "E9", "F", "PLE", "PLW", "RUF", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S301", "S603"]
"microirc_harness.py" = ["S603"]
"pyburlybot_modules/adminfuncs.py" = ["S311"]
"pyburlybot_modules/butt.py" = ["S311"]
"pyburlybot_modules/random.py" = ["S311"]
"pyburlybot_modules/updaterelaunch.py" = ["S603"]
"pyburlybot_modules/wikipedia.py" = ["S311"]
"util/irctools.py" = ["S311"]

[tool.mypy]
# no python_version pin: mypy follows the interpreter it runs under (the venv)
explicit_package_bases = true
ignore_missing_imports = true
allow_untyped_globals = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = false
