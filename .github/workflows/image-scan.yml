name: Image CVE scan

on:
  schedule:
    # Weekly scan of the published image: catches CVEs disclosed in already
    # merged (OS packages especially) dependencies between Renovate merges.
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/clammet/pyburlybot:latest
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # red run = notification; findings also land in the Security tab
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image
