---
name: Maintenance watchdog

on:
  schedule:
    - cron: "26 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: maintenance-watchdog
  cancel-in-progress: false


jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/watchdog@ecf21e09c31ccb57e2d528ba7c1a1a7d56294744 # v1.0.12
