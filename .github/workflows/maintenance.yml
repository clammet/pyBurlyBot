---
name: Maintenance watchdog

on:
  schedule:
    - cron: "26 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: maintenance-watchdog
  cancel-in-progress: false


jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/watchdog@3de04f1a5c384efab27782161fee12a5f4c13bcc # v1.0.37
