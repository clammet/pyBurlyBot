name: Dependency update safety

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  status:
  workflow_run:
    workflows: [Renovate]
    types: [completed]
  workflow_dispatch:

# Runs use trusted default-branch code and GitHub metadata only. Never check
# out a PR head or download PR artifacts in this privileged workflow.
permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: dependency-update-safety
  cancel-in-progress: false


jobs:
  reconcile:
    if: github.event_name != 'status' || startsWith(github.event.context, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: yuzuyuzuyu/repo-automation/actions/readiness@cfc732f420d71237505972b070da65ba9b36b055 # v1.0.4
