name: Renovate

on:
  schedule:
    # Hourly: an upstream release becomes a PR within the hour.
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables cron triggers after 60 days without repository
      # activity. Re-enabling an active workflow resets that clock, so this
      # keeps every scheduled workflow alive while leaving manually disabled
      # ones alone.
      - name: Keep scheduled workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' \
          | while read -r id; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done

      # Authenticates as the repo's Renovate GitHub App. Required app
      # permissions: Contents RW, Pull requests RW, Workflows RW, Checks R,
      # Commit statuses R, Dependabot alerts R, Metadata R, Issues RW
      # (dependency dashboard). Secrets: RENOVATE_APP_ID,
      # RENOVATE_APP_PRIVATE_KEY. Repo config: .github/renovate.json5.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.34.3 # renovate: depName=ghcr.io/renovatebot/renovate
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
