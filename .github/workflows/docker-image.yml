name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  publication-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and its CI
        id: gate
        uses: yuzuyuzuyu/repo-automation/actions/publication@798a10bfb4aeffe8c225f741d648bab0b14ca8e4 # v1.0.16

  build:
    if: needs.publication-ready.outputs.ready == 'true'
    needs: publication-ready
    runs-on: ubuntu-latest
    outputs:
      image-ref: ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the baked-in checkout is what the bot self-updates from
          fetch-depth: 0
          # never bake CI credentials into .git/config (repo is public; the
          # in-container `git fetch` is unauthenticated)
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repo
        name: Lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # renovate: datasource=github-releases depName=docker/buildx
          version: v0.38.1
          # renovate: datasource=docker depName=moby/buildkit
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          # use the checked-out workspace (includes .git), not the git context
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
