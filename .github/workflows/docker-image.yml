name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  publication-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and its CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publication.py

  build:
    if: needs.publication-ready.outputs.ready == 'true'
    needs: publication-ready
    runs-on: ubuntu-latest
    outputs:
      image-ref: ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the baked-in checkout is what the bot self-updates from
          fetch-depth: 0
          # never bake CI credentials into .git/config (repo is public; the
          # in-container `git fetch` is unauthenticated)
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repo
        name: Lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          # use the checked-out workspace (includes .git), not the git context
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
