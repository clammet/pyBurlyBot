name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names "test" and "docker-build" are required status checks in the
  # main-branch ruleset; renaming them breaks Renovate automerge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # bump alongside the Dockerfile base image and ruff target-version
          python-version: "3.14"

      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - run: ruff check .

      - run: ruff format --check .

      - run: mypy .

      - run: python -m unittest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the baked-in checkout is what the bot self-updates from
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
